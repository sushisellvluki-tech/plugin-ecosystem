services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecosystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [database:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d ecosystem']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 768m
  bootstrap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [python, -m, deploy.bootstrap]
    depends_on:
      db:
        condition: service_healthy
    secrets: [postgres_password, app_password, bootstrap_config]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    secrets: [database_url, server_config]
    ports:
      - '127.0.0.1:${PILOT_HTTP_PORT:-8000}:8000'
    networks: [frontend, backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz",timeout=5).read()']
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
volumes:
  database:
networks:
  frontend:
  backend:
    internal: true
secrets:
  postgres_password:
    file: ${PILOT_SECRETS_DIR:?Set PILOT_SECRETS_DIR}/postgres_password
  app_password:
    file: ${PILOT_SECRETS_DIR:?Set PILOT_SECRETS_DIR}/app_password
  bootstrap_config:
    file: ${PILOT_SECRETS_DIR:?Set PILOT_SECRETS_DIR}/bootstrap.json
  database_url:
    file: ${PILOT_SECRETS_DIR:?Set PILOT_SECRETS_DIR}/database_url
  server_config:
    file: ${PILOT_SECRETS_DIR:?Set PILOT_SECRETS_DIR}/server.json
