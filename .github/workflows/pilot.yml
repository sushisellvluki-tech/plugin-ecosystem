name: Private pilot deployment
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: pilot-ci
      PILOT_HTTP_PORT: '18080'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Prepare private synthetic pilot bundle
        run: |
          python -m deploy.prepare "$RUNNER_TEMP/pilot-private" --org synthetic-pilot --name 'Synthetic pilot' --hours 1
          echo "PILOT_SECRETS_DIR=$RUNNER_TEMP/pilot-private" >> "$GITHUB_ENV"
      - name: Boot private Compose stack
        run: python -m deploy.manage start
      - name: Verify roles, restart, backup and restore
        run: python -m scripts.pilot_smoke "$PILOT_SECRETS_DIR" "$RUNNER_TEMP/pilot-backup.dump"
      - name: Safe service status
        if: always()
        run: docker compose --project-name pilot-ci -f deploy/compose.yaml ps --all
      - name: Remove disposable CI stack
        if: always()
        run: docker compose --project-name pilot-ci -f deploy/compose.yaml down --volumes
